<title>Fire Geolocation Viewer</title>
<style>
.viz-root {
  --surface-1:      #fcfcfb;
  --surface-2:      #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --baseline:       #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  --series-1:       #2a78d6;   /* drone / track identity */
  --critical:       #d03b3b;   /* fire status */
  --critical-fill:  rgba(208,59,59,0.22);
  --critical-ghost: rgba(208,59,59,0.10);
  --good:           #0ca30c;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text-primary);
  background: var(--surface-2);
}
@media (prefers-color-scheme: dark) {
  .viz-root {
    --surface-1:      #1a1a19;
    --surface-2:      #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --critical:       #e66767;
    --critical-fill:  rgba(230,103,103,0.26);
    --critical-ghost: rgba(230,103,103,0.12);
    --good:           #0ca30c;
  }
}
:root[data-theme="dark"] .viz-root {
  --surface-1:      #1a1a19;
  --surface-2:      #0d0d0d;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --gridline:       #2c2c2a;
  --baseline:       #383835;
  --border:         rgba(255,255,255,0.10);
  --series-1:       #3987e5;
  --critical:       #e66767;
  --critical-fill:  rgba(230,103,103,0.26);
  --critical-ghost: rgba(230,103,103,0.12);
  --good:           #0ca30c;
}
:root[data-theme="light"] .viz-root {
  --surface-1:      #fcfcfb;
  --surface-2:      #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --gridline:       #e1e0d9;
  --baseline:       #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  --series-1:       #2a78d6;
  --critical:       #d03b3b;
  --critical-fill:  rgba(208,59,59,0.22);
  --critical-ghost: rgba(208,59,59,0.10);
  --good:           #0ca30c;
}

* { box-sizing: border-box; }
body { margin: 0; padding: 24px; }
.viz-root { max-width: 1120px; margin: 0 auto; padding: 20px 24px 28px; border-radius: 12px; }

h1 { font-size: 18px; margin: 0 0 2px; }
.subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 18px; }

.stat-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}
.stat-tile {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }
.stat-value { font-size: 20px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat-value.fire { color: var(--critical); }

.layout {
  display: grid;
  grid-template-columns: minmax(0,1fr) 260px;
  gap: 16px;
}
@media (max-width: 720px) {
  .layout { grid-template-columns: 1fr; }
  .stat-row { grid-template-columns: repeat(2, 1fr); }
}

.map-card, .side-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
}

.map-wrap { width: 100%; overflow: auto; }
svg#mapSvg { width: 100%; height: auto; display: block; }

.controls {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
}
button.play-btn {
  font: inherit;
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-primary);
  cursor: pointer;
}
button.play-btn:hover { background: var(--gridline); }
input[type="range"] { flex: 1; accent-color: var(--series-1); }
.frame-label { font-size: 12px; color: var(--text-secondary); min-width: 92px; text-align: right; font-variant-numeric: tabular-nums; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
.legend-item { display: flex; align-items: center; gap: 6px; }
.swatch { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.swatch.dot { width: 9px; height: 9px; border-radius: 50%; }

.side-card h2 { font-size: 13px; margin: 0 0 10px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
.detail-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--gridline); }
.detail-row:last-child { border-bottom: none; }
.detail-row .k { color: var(--text-secondary); }
.detail-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.status-pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 10px;
}
.status-pill.fire { background: var(--critical-fill); color: var(--critical); }
.status-pill.clear { background: rgba(12,163,12,0.15); color: var(--good); }

.table-toggle {
  margin-top: 16px;
  font-size: 12px;
  color: var(--series-1);
  cursor: pointer;
  user-select: none;
  background: none;
  border: none;
  font: inherit;
  padding: 0;
}
.table-wrap { margin-top: 10px; overflow-x: auto; display: none; }
.table-wrap.open { display: block; }
table.frame-table { border-collapse: collapse; width: 100%; font-size: 12px; }
table.frame-table th, table.frame-table td {
  text-align: left;
  padding: 6px 10px;
  border-bottom: 1px solid var(--gridline);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
table.frame-table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.03em; }
table.frame-table tr.current-row { background: var(--critical-ghost); }

.tooltip {
  position: absolute;
  pointer-events: none;
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 9px;
  font-size: 11px;
  color: var(--text-primary);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  opacity: 0;
  transition: opacity 0.1s;
  white-space: nowrap;
  z-index: 10;
}
</style>

<div class="viz-root">
  <h1>Fire Geolocation Viewer</h1>
  <p class="subtitle">GPS back-projected fire contours &amp; track velocity, from <code>geolocate.py</code> output</p>

  <div class="stat-row">
    <div class="stat-tile"><div class="stat-label">Frames</div><div class="stat-value" id="statFrames">–</div></div>
    <div class="stat-tile"><div class="stat-label">Fire rate</div><div class="stat-value fire" id="statFireRate">–</div></div>
    <div class="stat-tile"><div class="stat-label">GPS points</div><div class="stat-value" id="statPoints">–</div></div>
    <div class="stat-tile"><div class="stat-label">Tracks created</div><div class="stat-value" id="statTracks">–</div></div>
    <div class="stat-tile"><div class="stat-label">Avg. speed</div><div class="stat-value" id="statSpeed">–</div></div>
  </div>

  <div class="layout">
    <div class="map-card">
      <div class="map-wrap">
        <svg id="mapSvg" viewBox="0 0 600 480" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="controls">
        <button class="play-btn" id="playBtn">▶ Play</button>
        <input type="range" id="frameSlider" min="0" max="0" value="0" step="1">
        <span class="frame-label" id="frameLabel">frame_000</span>
      </div>
      <div class="legend">
        <span class="legend-item"><span class="swatch" style="background:var(--series-1)"></span>Drone flight path</span>
        <span class="legend-item"><span class="swatch dot" style="background:var(--series-1)"></span>Fire track centroid</span>
        <span class="legend-item"><span class="swatch" style="background:var(--critical)"></span>Fire contour (current frame)</span>
        <span class="legend-item"><span class="swatch" style="background:var(--critical); height:5px;"></span>Wavefront arc</span>
      </div>
      <button class="table-toggle" id="tableToggle">Show frame-by-frame table ▾</button>
      <div class="table-wrap" id="tableWrap">
        <table class="frame-table" id="frameTable"></table>
      </div>
    </div>

    <div class="side-card">
      <h2>Selected frame</h2>
      <div id="frameDetails"></div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

const results = DATA.results;
const summary = DATA.summary;
const EARTH_R = 6371000.0;

function toRad(d) { return d * Math.PI / 180; }

// Reference point: first available telemetry snapshot
const refFrame = results.find(r => r.telemetry_snapshot);
const refLat = refFrame.telemetry_snapshot.lat;
const refLon = refFrame.telemetry_snapshot.lon;

function localMeters(lat, lon) {
  const north = toRad(lat - refLat) * EARTH_R;
  const east = toRad(lon - refLon) * EARTH_R * Math.cos(toRad(refLat));
  return { north, east };
}

// Collect all points (drone positions + fire polygon vertices) to compute bounds
let pts = [];
results.forEach(r => {
  if (r.telemetry_snapshot) {
    pts.push(localMeters(r.telemetry_snapshot.lat, r.telemetry_snapshot.lon));
  }
  (r.fire_regions || []).forEach(fr => {
    (fr.gps_polygon || []).forEach(p => pts.push(localMeters(p.lat, p.lon)));
  });
});

const pad = 6; // meters padding
const minE = Math.min(...pts.map(p => p.east)) - pad;
const maxE = Math.max(...pts.map(p => p.east)) + pad;
const minN = Math.min(...pts.map(p => p.north)) - pad;
const maxN = Math.max(...pts.map(p => p.north)) + pad;

const svgW = 600, svgH = 480;
const spanE = Math.max(maxE - minE, 1);
const spanN = Math.max(maxN - minN, 1);
const scale = Math.min(svgW / spanE, svgH / spanN);
const drawW = spanE * scale, drawH = spanN * scale;
const offX = (svgW - drawW) / 2, offY = (svgH - drawH) / 2;

// East -> x (right), North -> up, so screen y = maxN - north
function project(lat, lon) {
  const { north, east } = localMeters(lat, lon);
  const x = offX + (east - minE) * scale;
  const y = offY + (maxN - north) * scale;
  return { x, y };
}

const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("mapSvg");
svg.setAttribute("viewBox", `0 0 ${svgW} ${svgH}`);

function el(tag, attrs) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// Static background layer: gridline frame + full drone path + full track centroid path
const bg = el("g", {});
svg.appendChild(bg);
bg.appendChild(el("rect", { x: 0, y: 0, width: svgW, height: svgH, fill: "none" }));

const dronePathPts = results.filter(r => r.telemetry_snapshot)
  .map(r => project(r.telemetry_snapshot.lat, r.telemetry_snapshot.lon));
if (dronePathPts.length > 1) {
  bg.appendChild(el("polyline", {
    points: dronePathPts.map(p => `${p.x},${p.y}`).join(" "),
    fill: "none", stroke: "var(--series-1)", "stroke-width": 2,
    "stroke-dasharray": "5 4", opacity: 0.55
  }));
}

const centroidPts = [];
results.forEach(r => {
  (r.fire_regions || []).forEach(fr => {
    if (fr.centroid_gps) {
      centroidPts.push({ ...project(fr.centroid_gps.lat, fr.centroid_gps.lon), frame: r.frame_id, region: fr });
    }
  });
});
if (centroidPts.length > 1) {
  bg.appendChild(el("polyline", {
    points: centroidPts.map(p => `${p.x},${p.y}`).join(" "),
    fill: "none", stroke: "var(--series-1)", "stroke-width": 2, opacity: 0.9
  }));
}
centroidPts.forEach(p => {
  const c = el("circle", { cx: p.x, cy: p.y, r: 4, fill: "var(--surface-1)", stroke: "var(--series-1)", "stroke-width": 2 });
  c.addEventListener("mousemove", (ev) => showTooltip(ev, p));
  c.addEventListener("mouseleave", hideTooltip);
  bg.appendChild(c);
});

// Dynamic layer redrawn per frame
const dynLayer = el("g", {});
svg.appendChild(dynLayer);

function clearDyn() { while (dynLayer.firstChild) dynLayer.removeChild(dynLayer.firstChild); }

function drawFrame(idx) {
  clearDyn();
  const r = results[idx];

  // ghost trail of prior fire polygons, fading
  for (let i = 0; i < idx; i++) {
    (results[i].fire_regions || []).forEach(fr => {
      if (!fr.gps_polygon) return;
      const p = fr.gps_polygon.map(pt => project(pt.lat, pt.lon));
      dynLayer.appendChild(el("polygon", {
        points: p.map(q => `${q.x},${q.y}`).join(" "),
        fill: "none", stroke: "var(--critical)", "stroke-width": 1,
        opacity: 0.18 + 0.5 * (i / Math.max(idx, 1))
      }));
    });
  }

  // current fire regions
  (r.fire_regions || []).forEach(fr => {
    if (!fr.gps_polygon) return;
    const poly = fr.gps_polygon.map(pt => project(pt.lat, pt.lon));
    dynLayer.appendChild(el("polygon", {
      points: poly.map(q => `${q.x},${q.y}`).join(" "),
      fill: "var(--critical-fill)", stroke: "var(--critical)", "stroke-width": 1.5
    }));
    if (fr.fire_front_arc && fr.fire_front_arc.length > 1) {
      const arc = fr.fire_front_arc.map(pt => project(pt.lat, pt.lon));
      dynLayer.appendChild(el("polyline", {
        points: arc.map(q => `${q.x},${q.y}`).join(" "),
        fill: "none", stroke: "var(--critical)", "stroke-width": 4, "stroke-linecap": "round"
      }));
    }
    if (fr.centroid_gps && fr.heading_deg != null) {
      const c = project(fr.centroid_gps.lat, fr.centroid_gps.lon);
      const rad = toRad(fr.heading_deg);
      const len = 18;
      const dx = Math.sin(rad) * len, dy = -Math.cos(rad) * len;
      dynLayer.appendChild(el("line", {
        x1: c.x, y1: c.y, x2: c.x + dx, y2: c.y + dy,
        stroke: "var(--text-primary)", "stroke-width": 1.5, "marker-end": "url(#arrowhead)"
      }));
    }
  });

  // drone marker
  if (r.telemetry_snapshot) {
    const d = project(r.telemetry_snapshot.lat, r.telemetry_snapshot.lon);
    dynLayer.appendChild(el("circle", { cx: d.x, cy: d.y, r: 6, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2 }));
  }

  document.getElementById("frameLabel").textContent = r.frame_id;
  renderDetails(r);
  highlightTableRow(idx);
}

// arrowhead marker def
const defs = el("defs", {});
defs.innerHTML = `<marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
  <path d="M0,0 L6,3 L0,6 Z" fill="var(--text-primary)"/>
</marker>`;
svg.insertBefore(defs, svg.firstChild);

function fmt(v, digits, unit) {
  if (v === null || v === undefined) return "–";
  return v.toFixed(digits) + (unit || "");
}

function renderDetails(r) {
  const fr = (r.fire_regions || [])[0];
  const rows = [
    ["Frame", r.frame_id],
    ["Timestamp", fmt(r.timestamp_s, 1, " s")],
    ["Fire detected", r.fire_detected ? '<span class="status-pill fire">FIRE</span>' : '<span class="status-pill clear">CLEAR</span>'],
    ["Classifier", r.classifier_prediction ?? "–"],
  ];
  if (fr) {
    rows.push(
      ["Track ID / status", `#${fr.track_id ?? "–"} (${fr.track_status ?? "–"})`],
      ["Velocity (inst.)", fmt(fr.velocity_mps, 2, " m/s")],
      ["Velocity (smoothed)", fmt(fr.velocity_smoothed_mps, 2, " m/s")],
      ["Heading", fmt(fr.heading_deg, 1, "°")],
      ["Track age", fmt(fr.track_age_s, 1, " s")],
      ["Fire area", fmt(fr.area_px, 0, " px")],
    );
  } else {
    rows.push(["Note", r.localization_note || "No fire region"]);
  }
  const wrap = document.getElementById("frameDetails");
  wrap.innerHTML = rows.map(([k, v]) =>
    `<div class="detail-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");
}

function showTooltip(ev, p) {
  const tt = document.getElementById("tooltip");
  const fr = p.region;
  tt.innerHTML = `<b>${p.frame}</b><br>v=${fmt(fr.velocity_mps,2," m/s")} · hdg=${fmt(fr.heading_deg,1,"°")}`;
  tt.style.left = (ev.pageX + 12) + "px";
  tt.style.top = (ev.pageY + 12) + "px";
  tt.style.opacity = 1;
}
function hideTooltip() { document.getElementById("tooltip").style.opacity = 0; }

// Table
function buildTable() {
  const table = document.getElementById("frameTable");
  const head = `<tr><th>Frame</th><th>t (s)</th><th>Status</th><th>Track</th><th>Velocity (m/s)</th><th>Heading</th><th>Area (px)</th></tr>`;
  const body = results.map((r, i) => {
    const fr = (r.fire_regions || [])[0];
    return `<tr data-idx="${i}">
      <td>${r.frame_id}</td>
      <td>${fmt(r.timestamp_s,1)}</td>
      <td>${r.fire_detected ? "FIRE" : "clear"}</td>
      <td>${fr ? "#" + fr.track_id + " (" + fr.track_status + ")" : "–"}</td>
      <td>${fr ? fmt(fr.velocity_smoothed_mps,2) : "–"}</td>
      <td>${fr ? fmt(fr.heading_deg,1,"°") : "–"}</td>
      <td>${fr ? fmt(fr.area_px,0) : "–"}</td>
    </tr>`;
  }).join("");
  table.innerHTML = head + body;
  table.querySelectorAll("tr[data-idx]").forEach(tr => {
    tr.addEventListener("click", () => {
      const idx = +tr.dataset.idx;
      slider.value = idx;
      drawFrame(idx);
    });
  });
}
function highlightTableRow(idx) {
  document.querySelectorAll("#frameTable tr[data-idx]").forEach(tr => {
    tr.classList.toggle("current-row", +tr.dataset.idx === idx);
  });
}

document.getElementById("tableToggle").addEventListener("click", (e) => {
  const w = document.getElementById("tableWrap");
  w.classList.toggle("open");
  e.target.textContent = w.classList.contains("open") ? "Hide frame-by-frame table ▴" : "Show frame-by-frame table ▾";
});

// Stats
document.getElementById("statFrames").textContent = summary.total_frames ?? results.length;
document.getElementById("statFireRate").textContent = summary.fire_rate != null ? (summary.fire_rate * 100).toFixed(0) + "%" : "–";
document.getElementById("statPoints").textContent = summary.total_gps_points ?? "–";
document.getElementById("statTracks").textContent = summary.tracks_created ?? "–";
const speeds = results.flatMap(r => (r.fire_regions || []).map(fr => fr.velocity_smoothed_mps).filter(v => v != null));
const avgSpeed = speeds.length ? (speeds.reduce((a,b) => a+b, 0) / speeds.length) : null;
document.getElementById("statSpeed").textContent = avgSpeed != null ? avgSpeed.toFixed(1) + " m/s" : "–";

// Slider + playback
const slider = document.getElementById("frameSlider");
slider.max = results.length - 1;
slider.addEventListener("input", () => drawFrame(+slider.value));

let playing = false, timer = null;
document.getElementById("playBtn").addEventListener("click", (e) => {
  playing = !playing;
  e.target.textContent = playing ? "⏸ Pause" : "▶ Play";
  if (playing) {
    timer = setInterval(() => {
      let next = (+slider.value + 1) % results.length;
      slider.value = next;
      drawFrame(next);
    }, 900);
  } else {
    clearInterval(timer);
  }
});

buildTable();
drawFrame(0);
</script>
